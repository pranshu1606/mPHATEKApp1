name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/resume-portal

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          DATABASE_PATH: /tmp/ci.db
          NEXT_TELEMETRY_DISABLED: "1"

  backend:
    name: Backend (install + import)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Import FastAPI app
        run: python -c "from backend.main import app; print(app.title)"
        env:
          RESUME_VECTOR_STORE_PATH: /tmp/vectorstore

  infra:
    name: Infra (terraform + compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt / init / validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: Validate production compose config
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
        env:
          PUBLIC_URL: https://example.cloudfront.net
          ORIGIN_HOST: example.duckdns.org
          ORIGIN_VERIFY_SECRET: ci-placeholder
          ACME_EMAIL: ci@example.com
      - name: Shell script syntax
        run: for f in infra/*.sh; do bash -n "$f"; done

  images:
    name: Image (${{ matrix.service }}, arm64)
    # Native Arm runner: builds match the Graviton VM without QEMU emulation.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.service }}
          platforms: linux/arm64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to EC2 (SSM)
    needs: [frontend, backend, infra, images]
    # Skips cleanly until the infrastructure exists and the repo variables are set.
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.EC2_INSTANCE_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for AWS — no stored AWS keys
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      ORIGIN_HOST: ${{ vars.ORIGIN_HOST }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run deploy on the VM via SSM
        run: |
          CMD="sudo -u ubuntu -H bash -c 'cd ~/app && git fetch --prune origin main && git reset --hard $GITHUB_SHA && bash infra/deploy.sh $GITHUB_SHA'"
          jq -n --arg cmd "$CMD" '{commands: [$cmd], executionTimeout: ["1800"]}' > params.json

          CID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "SSM command: $CID"

          STATUS=Pending
          for i in $(seq 1 120); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) echo "… $STATUS";; *) break;; esac
          done

          echo "--- stdout ---"
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "--- stderr ---"
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text
          echo "Final status: $STATUS"
          [ "$STATUS" = "Success" ]

      - name: Smoke test through CloudFront
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL/login" || true)
            [ "$code" = "200" ] && break
            echo "attempt $i: HTTP $code"; sleep 10
          done
          [ "$code" = "200" ] || { echo "Site did not come up"; exit 1; }

          echo "--- edge headers ---"
          curl -sI "$PUBLIC_URL/login" | grep -iE '^(x-cache|x-amz-cf-pop|via|server-timing|strict-transport-security):'

      - name: Verify the origin is unreachable except through CloudFront
        if: env.ORIGIN_HOST != ''
        run: |
          code=$(curl -s -o /dev/null -m 10 -w '%{http_code}' "https://$ORIGIN_HOST/login" || true)
          echo "direct origin: HTTP $code (000 = blocked by security group)"
          [ "$code" != "200" ]
